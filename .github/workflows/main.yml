name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d proj
          ls -la proj
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: proj
        run: |
          npm install
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tasmee-alhasoon-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
